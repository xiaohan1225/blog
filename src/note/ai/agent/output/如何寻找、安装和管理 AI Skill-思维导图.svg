<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#d8dee9" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="centerGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 42px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #e0f2fe; }
      .main { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 750; fill: #1f2937; }
      .item { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #374151; }
      .hint { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #6b7280; }
      .node { rx: 18; filter: url(#shadow); stroke-width: 2.5; }
      .leaf { rx: 14; filter: url(#shadow); stroke-width: 2; }
      .line { fill: none; stroke-linecap: round; stroke-width: 8; opacity: 0.88; }
      .thin { fill: none; stroke-linecap: round; stroke-width: 4.5; opacity: 0.72; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1100"/>
  <circle cx="900" cy="550" r="390" fill="#eef7ff" opacity="0.42"/>
  <circle cx="900" cy="550" r="255" fill="#f7f7ff" opacity="0.55"/>

  <!-- Main branches -->
  <path class="line" d="M820 525 C690 410, 570 265, 390 195" stroke="#60a5fa"/>
  <path class="line" d="M805 555 C650 540, 535 510, 365 500" stroke="#34d399"/>
  <path class="line" d="M825 590 C680 710, 560 815, 390 905" stroke="#a78bfa"/>
  <path class="line" d="M980 525 C1125 390, 1255 270, 1430 195" stroke="#fb7185"/>
  <path class="line" d="M995 555 C1150 540, 1275 510, 1455 500" stroke="#f59e0b"/>
  <path class="line" d="M975 590 C1120 715, 1240 825, 1420 905" stroke="#22c55e"/>

  <!-- Center -->
  <rect x="745" y="455" width="310" height="190" rx="34" fill="url(#centerGradient)" filter="url(#shadow)"/>
  <text x="900" y="535" text-anchor="middle" class="title">AI Skill 管理</text>
  <text x="900" y="575" text-anchor="middle" class="subtitle">寻找 · 判断 · 安装 · 维护</text>

  <!-- Left top: clarify needs -->
  <rect class="node" x="145" y="118" width="310" height="82" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="300" y="169" text-anchor="middle" class="main">先明确需求</text>
  <path class="thin" d="M370 210 C330 250, 290 280, 235 305" stroke="#60a5fa"/>
  <path class="thin" d="M395 213 C370 265, 345 310, 325 360" stroke="#60a5fa"/>
  <path class="thin" d="M420 210 C460 250, 500 280, 560 305" stroke="#60a5fa"/>
  <rect class="leaf" x="80" y="288" width="270" height="58" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="215" y="325" text-anchor="middle" class="item">稳定复用哪类经验</text>
  <rect class="leaf" x="125" y="372" width="305" height="58" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="277" y="409" text-anchor="middle" class="item">长期工作流还是一次性任务</text>
  <rect class="leaf" x="470" y="288" width="275" height="58" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="607" y="325" text-anchor="middle" class="item">关键词越具体越好</text>

  <!-- Left middle: channels -->
  <rect class="node" x="105" y="455" width="300" height="82" fill="#dcfce7" stroke="#34d399"/>
  <text x="255" y="506" text-anchor="middle" class="main">去哪里找</text>
  <path class="thin" d="M415 500 C480 465, 535 445, 600 430" stroke="#34d399"/>
  <path class="thin" d="M415 517 C500 520, 565 520, 650 520" stroke="#34d399"/>
  <path class="thin" d="M405 545 C465 590, 520 625, 590 660" stroke="#34d399"/>
  <rect class="leaf" x="455" y="382" width="260" height="58" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="585" y="419" text-anchor="middle" class="item">官方仓库与目录站</text>
  <rect class="leaf" x="440" y="492" width="255" height="58" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="567" y="529" text-anchor="middle" class="item">skills.sh / SkillHub</text>
  <rect class="leaf" x="395" y="650" width="315" height="58" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="552" y="687" text-anchor="middle" class="item">先看原仓库和 SKILL.md</text>

  <!-- Left bottom: quality -->
  <rect class="node" x="115" y="862" width="310" height="82" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="270" y="913" text-anchor="middle" class="main">判断是否优质</text>
  <path class="thin" d="M445 875 C515 835, 570 805, 635 765" stroke="#a78bfa"/>
  <path class="thin" d="M445 907 C525 915, 585 920, 665 920" stroke="#a78bfa"/>
  <path class="thin" d="M425 950 C470 1000, 530 1028, 600 1040" stroke="#a78bfa"/>
  <rect class="leaf" x="555" y="735" width="260" height="58" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="685" y="772" text-anchor="middle" class="item">来源可信，有维护</text>
  <rect class="leaf" x="605" y="890" width="270" height="58" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="740" y="927" text-anchor="middle" class="item">有步骤、标准和边界</text>
  <rect class="leaf" x="520" y="1005" width="310" height="58" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="675" y="1042" text-anchor="middle" class="item">不过短，也不过长占上下文</text>

  <!-- Right top: precheck -->
  <rect class="node" x="1345" y="118" width="310" height="82" fill="#ffe4e6" stroke="#fb7185"/>
  <text x="1500" y="169" text-anchor="middle" class="main">安装前检查</text>
  <path class="thin" d="M1420 210 C1365 250, 1325 285, 1280 330" stroke="#fb7185"/>
  <path class="thin" d="M1475 215 C1460 270, 1445 320, 1435 375" stroke="#fb7185"/>
  <path class="thin" d="M1535 210 C1585 250, 1620 285, 1660 330" stroke="#fb7185"/>
  <rect class="leaf" x="1160" y="315" width="260" height="58" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="1290" y="352" text-anchor="middle" class="item">是否读取敏感目录</text>
  <rect class="leaf" x="1455" y="590" width="240" height="58" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="1575" y="627" text-anchor="middle" class="item">scripts 是否可信</text>
  <rect class="leaf" x="1530" y="315" width="270" height="58" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="1665" y="352" text-anchor="middle" class="item">是否覆盖、上传、删除</text>

  <!-- Right middle: install maintain -->
  <rect class="node" x="1390" y="455" width="310" height="82" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1545" y="506" text-anchor="middle" class="main">安装和维护</text>
  <path class="thin" d="M1380 493 C1300 455, 1235 430, 1165 405" stroke="#f59e0b"/>
  <path class="thin" d="M1380 520 C1295 525, 1225 530, 1145 535" stroke="#f59e0b"/>
  <path class="thin" d="M1395 548 C1330 610, 1280 655, 1215 710" stroke="#f59e0b"/>
  <rect class="leaf" x="1110" y="376" width="250" height="58" fill="#fffbeb" stroke="#fde68a"/>
  <text x="1235" y="413" text-anchor="middle" class="item">npx skills add</text>
  <rect class="leaf" x="1095" y="506" width="255" height="58" fill="#fffbeb" stroke="#fde68a"/>
  <text x="1222" y="543" text-anchor="middle" class="item">update / remove</text>
  <rect class="leaf" x="1115" y="645" width="285" height="58" fill="#fffbeb" stroke="#fde68a"/>
  <text x="1257" y="682" text-anchor="middle" class="item">重启工具后生效</text>

  <!-- Right bottom: conflict -->
  <rect class="node" x="1345" y="862" width="310" height="82" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1500" y="913" text-anchor="middle" class="main">管理冲突</text>
  <path class="thin" d="M1335 875 C1265 830, 1210 800, 1145 765" stroke="#22c55e"/>
  <path class="thin" d="M1340 910 C1260 915, 1200 920, 1120 925" stroke="#22c55e"/>
  <path class="thin" d="M1360 950 C1300 1000, 1240 1028, 1170 1040" stroke="#22c55e"/>
  <rect class="leaf" x="1020" y="735" width="270" height="58" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1155" y="772" text-anchor="middle" class="item">不要堆相似 Skill</text>
  <rect class="leaf" x="950" y="895" width="300" height="58" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1100" y="932" text-anchor="middle" class="item">合并重叠项，明确边界</text>
  <rect class="leaf" x="1000" y="1005" width="310" height="58" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1155" y="1042" text-anchor="middle" class="item">用具体 name 和 description</text>
</svg>
