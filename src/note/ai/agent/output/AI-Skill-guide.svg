<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.7" fill="#d7dce5" opacity="0.72"/>
    </pattern>
    <filter id="softShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#c7ceda" flood-opacity="0.45"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .center { fill: #080b1f; filter: url(#softShadow); }
      .centerText { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 40px; font-weight: 850; fill: #fff; }
      .topicText { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 760; fill: #fff; }
      .subText { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 27px; fill: #111827; }
      .smallText { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 24px; fill: #111827; }
      .topic { rx: 8; filter: url(#softShadow); }
      .sub { rx: 8; fill: #e9ebf4; filter: url(#softShadow); }
      .line { fill: none; stroke-linecap: round; stroke-width: 8; }
      .thin { fill: none; stroke-linecap: round; stroke-width: 4; }
    </style>
  </defs>

  <rect class="bg" width="2200" height="1700"/>
  <rect width="2200" height="1700" fill="url(#dots)"/>

  <!-- center -->
  <rect class="center" x="95" y="645" width="480" height="100" rx="12"/>
  <text class="centerText" x="335" y="707" text-anchor="middle">Skill寻找、安装和管理</text>

  <!-- main curved branches -->
  <path class="line" d="M575 690 C600 220, 640 170, 705 170" stroke="#5b83c7"/>
  <path class="line" d="M575 695 C625 420, 650 410, 705 410" stroke="#f28c2d"/>
  <path class="line" d="M575 700 C625 610, 650 610, 705 610" stroke="#ef4444"/>
  <path class="line" d="M575 705 C625 1040, 650 1167, 705 1167" stroke="#10b981"/>
  <path class="line" d="M575 710 C600 1390, 640 1519, 705 1519" stroke="#3b9edb"/>

  <!-- 1 define needs -->
  <rect class="topic" x="705" y="135" width="185" height="78" fill="#668dcc"/>
  <text class="topicText" x="797" y="185" text-anchor="middle">先明确</text>
  <path class="thin" d="M890 174 C940 174, 980 174, 1025 174" stroke="#668dcc"/>
  <rect class="sub" x="1025" y="120" width="635" height="108"/>
  <text class="subText" x="1048" y="158">不要从“哪个 Skill 最火”开始，</text>
  <text class="subText" x="1048" y="195">而是先想清楚要复用哪类任务经验。</text>
  <path class="thin" d="M1660 174 C1710 174, 1735 130, 1760 100" stroke="#668dcc"/>
  <path class="thin" d="M1660 174 C1710 174, 1735 174, 1760 174" stroke="#668dcc"/>
  <path class="thin" d="M1660 174 C1710 174, 1735 225, 1760 265" stroke="#668dcc"/>
  <rect class="sub" x="1760" y="72" width="310" height="56"/>
  <text class="smallText" x="1782" y="108">一次性任务 / 长期工作流</text>
  <rect class="sub" x="1760" y="146" width="270" height="56"/>
  <text class="smallText" x="1782" y="182">知识流程 / 工具调用</text>
  <rect class="sub" x="1760" y="238" width="300" height="56"/>
  <text class="smallText" x="1782" y="274">关键词越具体越好</text>

  <!-- 2 where to find -->
  <rect class="topic" x="705" y="372" width="235" height="78" fill="#f28c2d"/>
  <text class="topicText" x="822" y="423" text-anchor="middle">去哪里找</text>
  <path class="thin" d="M940 411 C995 411, 1028 375, 1060 342" stroke="#f28c2d"/>
  <path class="thin" d="M940 411 C995 411, 1028 411, 1060 411" stroke="#f28c2d"/>
  <path class="thin" d="M940 411 C995 411, 1028 462, 1060 496" stroke="#f28c2d"/>
  <rect class="sub" x="1060" y="313" width="500" height="58"/>
  <text class="subText" x="1084" y="350">官方：Anthropic / 字节生态</text>
  <rect class="sub" x="1060" y="382" width="670" height="58"/>
  <text class="subText" x="1084" y="419">目录站：skills.sh / AgentSkill.sh / SkillsMP</text>
  <rect class="sub" x="1060" y="467" width="520" height="58"/>
  <text class="subText" x="1084" y="504">国内：SkillHub / 腾讯 SkillHub</text>

  <!-- 3 judge quality -->
  <rect class="topic" x="705" y="572" width="270" height="78" fill="#ef4444"/>
  <text class="topicText" x="840" y="623" text-anchor="middle">判断是否优质</text>
  <path class="thin" d="M975 611 C1025 611, 1055 612, 1090 619" stroke="#ef4444"/>
  <path class="thin" d="M975 611 C1030 611, 1060 675, 1090 697" stroke="#ef4444"/>
  <path class="thin" d="M975 611 C1025 611, 1055 742, 1090 802" stroke="#ef4444"/>
  <path class="thin" d="M975 611 L1090 908" stroke="#ef4444"/>
  <path class="thin" d="M975 611 C1028 611, 1058 940, 1090 1001" stroke="#ef4444"/>
  <rect class="sub" x="1090" y="590" width="520" height="58"/>
  <text class="subText" x="1114" y="627">来源可信：官方、知名组织、仓库活跃</text>
  <rect class="sub" x="1090" y="668" width="560" height="58"/>
  <text class="subText" x="1114" y="705">主文件可执行：有步骤、输出标准和边界</text>
  <rect class="sub" x="1090" y="760" width="610" height="84"/>
  <text class="subText" x="1114" y="796">长度合适：太短像口号，太长占上下文；</text>
  <text class="subText" x="1114" y="830">复杂资料拆到 references / assets / scripts</text>
  <rect class="sub" x="1090" y="862" width="560" height="92"/>
  <text class="subText" x="1114" y="900">关键节点确认：修改、删除、联网</text>
  <text class="subText" x="1114" y="936">迁移和阶段性产物，先确认再做</text>
  <rect class="sub" x="1090" y="972" width="540" height="58"/>
  <text class="subText" x="1114" y="1009">低质量信号：口号化、边界宽、没有流程</text>

  <!-- 4 install maintain -->
  <rect class="topic" x="705" y="1128" width="270" height="78" fill="#10b981"/>
  <text class="topicText" x="840" y="1179" text-anchor="middle">安装和维护</text>
  <path class="thin" d="M975 1167 C1030 1167, 1058 1135, 1090 1134" stroke="#10b981"/>
  <path class="thin" d="M975 1167 C1030 1167, 1058 1215, 1090 1239" stroke="#10b981"/>
  <path class="thin" d="M975 1167 C1020 1167, 1045 1305, 1080 1337" stroke="#10b981"/>
  <rect class="sub" x="1090" y="1105" width="500" height="58"/>
  <text class="subText" x="1114" y="1142">npx skills add：项目级或全局安装</text>
  <rect class="sub" x="1090" y="1210" width="540" height="58"/>
  <text class="subText" x="1114" y="1247">npx skills update / remove 管理版本</text>
  <rect class="sub" x="1080" y="1308" width="520" height="58"/>
  <text class="subText" x="1104" y="1345">手动复制要自己维护，更新后重启工具</text>

  <!-- 5 conflict -->
  <rect class="topic" x="705" y="1480" width="320" height="78" fill="#3b9edb"/>
  <text class="topicText" x="865" y="1531" text-anchor="middle">管理 Skill 冲突</text>
  <path class="thin" d="M1025 1519 C1080 1519, 1115 1445, 1160 1444" stroke="#3b9edb"/>
  <path class="thin" d="M1025 1519 C1080 1519, 1115 1519, 1160 1519" stroke="#3b9edb"/>
  <path class="thin" d="M1025 1519 C1080 1519, 1115 1585, 1160 1609" stroke="#3b9edb"/>
  <rect class="sub" x="1160" y="1415" width="520" height="58"/>
  <text class="subText" x="1184" y="1452">不要同时保留一堆相似 Skill</text>
  <rect class="sub" x="1160" y="1490" width="500" height="58"/>
  <text class="subText" x="1184" y="1527">合并高度重叠项，给每个 Skill 明确边界</text>
  <rect class="sub" x="1160" y="1580" width="680" height="58"/>
  <text class="subText" x="1184" y="1617">用更具体的 name 和 description 降低冲突</text>
</svg>
